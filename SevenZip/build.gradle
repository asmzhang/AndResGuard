apply plugin: 'maven-publish'
apply plugin: 'java'

version rootProject.ext.versionName
group rootProject.ext.groupID
def POM_ARTIFACT_ID = 'sevenzip'

task sourcesJar(type: Jar) {
  from sourceSets.main.java.srcDirs
  classifier = 'sources'
}

task javadocJar(type: Jar, dependsOn: javadoc) {
  classifier = 'javadoc'
  from javadoc.destinationDir
}

artifacts {
  archives javadocJar
  archives sourcesJar
}

ext {
    // artifactId
    aarId = "sevenzip"
    // snapshot version use x.x.x-snapshot, release version use x.x.x
    versionName = rootProject.ext.versionName
    // 默认 false, true 代表推远程maven仓
    publishToServer = rootProject.ext.publishToServer
    groupID = rootProject.ext.groupID
    // aar local path
    localPath = '../repo'
}

apply from: rootProject.file('gradle/java-artifacts.gradle')
