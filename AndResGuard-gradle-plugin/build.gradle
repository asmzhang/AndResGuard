apply plugin: 'groovy'
apply plugin: 'java'

version = rootProject.ext.versionName
group = rootProject.ext.groupID

repositories {
    maven {
        url uri('../repo')
    }
//    mavenCentral()
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()
    implementation 'com.google.gradle:osdetector-gradle-plugin:1.6.0'
    implementation project(':AndResGuard-core')
}

/**
 * 打包成 fat jar（不依赖 shadow 插件）
 */
task fatJar(type: Jar) {
    archiveBaseName.set("AndResGuard-gradle-plugin")
    archiveVersion.set(rootProject.ext.versionName)
    archiveClassifier.set("")
    destinationDirectory.set(file("$buildDir/libs"))

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
                'Implementation-Title': archiveBaseName.get(),
                'Implementation-Version': archiveVersion.get(),
                'Built-By': System.getProperty("user.name"),
                'Built-Date': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        )
    }

    from sourceSets.main.output

    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA',
            'META-INF/*.MF', 'META-INF/*.txt', 'META-INF/versions/**',
            'META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/NOTICE',
            'META-INF/plexus/components.xml'
}

/**
 * 让 build 也生成 fatJar
 */
build.dependsOn fatJar
